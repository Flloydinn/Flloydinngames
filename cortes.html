  <style>
    .container{width:min(1100px,calc(100% - 2rem))}
    .clip-tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1rem}
    .clip-tabs button{font:inherit;font-size:.88rem;font-weight:700;padding:.4rem .8rem;border-radius:999px;cursor:pointer;color:var(--muted);background:transparent;border:1px solid var(--border)}
    .clip-tabs button[aria-pressed="true"]{color:#fff;background:var(--brand);border-color:var(--brand)}
    .clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem}
    .clip{display:flex;flex-direction:column;border-radius:.9rem;overflow:hidden;background:var(--card);border:1px solid var(--border);min-width:0}
    .clip__media{position:relative;aspect-ratio:16/9;background:#000}
    .clip__media img{width:100%;height:100%;object-fit:cover}
    .clip__media iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .clip__play{position:absolute;inset:0;display:grid;place-items:center;border:0;padding:0;cursor:pointer;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.4))}
    .clip__play span{display:grid;place-items:center;width:54px;height:38px;border-radius:.7rem;background:rgba(143,0,0,.92);color:#fff;font-size:1rem;transition:transform .15s ease}
    .clip__play:hover span,.clip__play:focus-visible span{transform:scale(1.08)}
    .clip__badges{position:absolute;left:.5rem;bottom:.5rem;display:flex;gap:.3rem;pointer-events:none}
    .clip__badges span{font-size:.72rem;font-weight:800;padding:.1rem .4rem;border-radius:.35rem;background:rgba(0,0,0,.65);border:1px solid #2b2e35}
    .clip__body{display:flex;flex-direction:column;gap:.4rem;padding:.75rem .8rem .85rem;flex:1}
    .clip__title{margin:0;font-size:.95rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .clip__meta{font-size:.8rem;color:var(--muted)}
    .clip__actions{display:flex;gap:.4rem;margin-top:auto}
    @media (prefers-reduced-motion: reduce){ .clip__play span{transition:none} .clip__play:hover span{transform:none} }
  </style>

<body>
  <site-header></site-header>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Clipes e momentos rápidos</span>
        <h1>Cortes do <span>Flloydinn</span></h1>
        <p>Shorts e vídeos curtos do canal, para assistir em segundos. Enquanto o canal <a href="canais.html#cortes">Cortes do Flloydinn</a> não estreia, os momentos rápidos ficam reunidos aqui.</p>
      </div>
    </section>
    <section class="page-section" aria-labelledby="clipsTitle">
      <div class="container">
        <h2 class="film-title" id="clipsTitle">Momentos rápidos</h2>
        <div class="clip-tabs" id="clipTabs" role="group" aria-label="Filtrar cortes"></div>
        <div class="clips" id="clips" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <site-footer></site-footer>

  <script>
    // Cortes = Shorts do catálogo + vídeos de até 5 minutos (data/videos.json, gerado pelo script do canal)
    const MAX_SEC = 300;
    const ID_RE = /^[A-Za-z0-9_-]{11}$/;
    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmtDur = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s/60), x = s%60; return m + ':' + String(x).padStart(2,'0'); };
    const fmtDate = iso => iso ? new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR') : '';
    const isoDur = s => { s = Math.max(1, Math.round(s)); const m = Math.floor(s/60), x = s%60; return 'PT' + (m ? m + 'M' : '') + (x || !m ? x + 'S' : ''); };
    const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 3 4.5 6.6 4.5c2.1 0 3.6 1.2 4.4 2.5.8-1.3 2.3-2.5 4.4-2.5 3.6 0 5.7 3.8 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg>';
    const SHARE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"/></svg>';
    let CLIPS = [], filter = 'all';
    const state = (o) => window.FlloydEngage ? FlloydEngage.stateCard(o) : `<p class="empty">${esc(o.title)}</p>`;

    function render(){
      const counts = { all: CLIPS.length, short: CLIPS.filter(c => c.type === 'short').length, quick: CLIPS.filter(c => c.type !== 'short').length };
      $('#clipTabs').innerHTML = [['all','Tudo'],['short','Shorts'],['quick','Até 5 min']].filter(([k]) => k === 'all' || counts[k])
        .map(([k, l]) => `<button type="button" data-f="${k}" aria-pressed="${filter === k}">${l} <small>${counts[k]}</small></button>`).join('');
      const list = CLIPS.filter(c => filter === 'all' || (filter === 'short' ? c.type === 'short' : c.type !== 'short'));
      if(!list.length){
        $('#clips').innerHTML = state({ icon:'✂', title:'Ainda não há cortes por aqui', text:'Os momentos rápidos aparecem assim que o canal publicar Shorts ou vídeos curtos.',
          actions:[{ label:'Ver vídeos recentes', href:'videos.html' }, { label:'Conhecer os canais', href:'canais.html' }] });
        return;
      }
      $('#clips').innerHTML = list.map(c => `
        <article class="clip lift" data-id="${c.id}">
          <div class="clip__media">
            <img src="https://i.ytimg.com/vi/${c.id}/hqdefault.jpg" alt="" loading="lazy" decoding="async" width="480" height="360">
            ${c.embeddable ? `<button type="button" class="clip__play" data-play="${c.id}" aria-label="Assistir: ${esc(c.title)}"><span aria-hidden="true">▶</span></button>`
                           : `<a class="clip__play" href="https://www.youtube.com/watch?v=${c.id}" target="_blank" rel="noopener" aria-label="Abrir no YouTube: ${esc(c.title)}"><span aria-hidden="true">▶</span></a>`}
            <div class="clip__badges"><span>${c.type === 'short' ? 'SHORT' : 'CORTE'}</span><span>${fmtDur(c.dur)}</span></div>
          </div>
          <div class="clip__body">
            <h3 class="clip__title">${esc(c.title)}</h3>
            <span class="clip__meta">${esc(c.game || 'Flloydinn Gameplay')}${c.published ? ' • ' + fmtDate(c.published) : ''}</span>
            <div class="clip__actions">
              <button type="button" class="icon-btn" data-fav data-fav-type="video" data-fav-id="${c.id}" data-fav-title="${esc(c.title)}" data-fav-url="videos.html?v=${c.id}" data-fav-img="https://i.ytimg.com/vi/${c.id}/hqdefault.jpg" aria-pressed="false" title="Favoritar">${HEART}</button>
              <button type="button" class="icon-btn" data-share data-share-type="video" data-share-url="videos.html?v=${c.id}" data-share-title="${esc(c.title)}" aria-label="Compartilhar: ${esc(c.title)}" title="Compartilhar">${SHARE}</button>
            </div>
          </div>
        </article>`).join('');
      if(window.FlloydEngage) FlloydEngage.refresh($('#clips'));
    }

    // play: troca a thumbnail pelo player só no clique (facade)
    document.addEventListener('click', e => {
      const t = e.target.closest('#clipTabs [data-f]'); if(t){ filter = t.dataset.f; render(); return; }
      const b = e.target.closest('button[data-play]'); if(!b || !ID_RE.test(b.dataset.play)) return;
      const media = b.closest('.clip__media');
      const f = document.createElement('iframe');
      f.src = `https://www.youtube-nocookie.com/embed/${b.dataset.play}?autoplay=1&rel=0`;
      f.title = b.getAttribute('aria-label').replace('Assistir: ', '');
      f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share'; f.allowFullscreen = true;
      media.replaceChildren(f);
    });

    function setLD(list){
      const items = list.filter(c => c.published).map((c, i) => ({ "@type":"ListItem", "position": i + 1, "item": {
        "@type":"VideoObject", "@id":`https://www.youtube.com/watch?v=${c.id}`, "name": c.title, "description": c.description || c.title,
        "thumbnailUrl":[`https://i.ytimg.com/vi/${c.id}/hqdefault.jpg`], "uploadDate": c.published, "duration": isoDur(c.dur),
        "embedUrl":`https://www.youtube.com/embed/${c.id}`, "url":`https://www.youtube.com/watch?v=${c.id}` } }));
      if(!items.length) return;
      const el = document.createElement('script'); el.type = 'application/ld+json'; el.id = 'ld-clips';
      el.textContent = JSON.stringify({ "@context":"https://schema.org", "@type":"ItemList", "name":"Cortes e momentos rápidos do Flloydinn Gameplay", "url":"https://flloydinn.netlify.app/cortes.html", "itemListElement": items }).replace(/</g, '\\u003c');
      document.head.appendChild(el);
    }

    async function init(){
      $('#clips').innerHTML = state({ icon:'✂', title:'Carregando os cortes…', loading:true });
      try{
        const r = await fetch('data/videos.json', { cache:'no-cache' });
        if(!r.ok) throw new Error('HTTP ' + r.status);
        const d = await r.json();
        CLIPS = (d.videos || []).filter(v => v && ID_RE.test(String(v.id)) && Number(v.dur) > 0 && (v.type === 'short' || v.dur <= MAX_SEC))
          .map(v => ({ id:String(v.id), title:String(v.title || 'Sem título'), dur:Number(v.dur), type: v.type === 'short' ? 'short' : 'quick',
                       game: v.game && v.game !== 'Outros' ? String(v.game) : '', published: /^\d{4}-\d{2}-\d{2}$/.test(v.published || '') ? v.published : '',
                       description: String(v.description || ''), embeddable: v.embeddable !== false }))
          .sort((a, b) => b.published.localeCompare(a.published));
        render(); setLD(CLIPS);
      }catch(err){
        console.warn('[cortes]', err);
        $('#clips').innerHTML = state({ icon:'⚠', title:'Não foi possível carregar os cortes', text:'A lista de vídeos não respondeu agora.',
          actions:[{ label:'Tentar novamente', id:'retryClips' }, { label:'Ver no YouTube', href:'https://www.youtube.com/@flloydinn/shorts' }] });
        const b = document.getElementById('retryClips'); if(b) b.onclick = init;
      }
    }
    init();
  </script>
