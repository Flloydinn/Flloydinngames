  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Artigo — Blog Flloydinn">
  <meta name="twitter:description" content="Artigos, análises e notícias de games do blog do canal Flloydinn Gameplay.">

  <script src="layout.js"></script>
  <style>
    body{line-height:1.65} /* ajuste desta página sobre styles.css */
    .container{width:min(1100px,calc(100% - 2rem))} /* ajuste desta página sobre styles.css */
    .btn{padding:.55rem .85rem} /* ajuste desta página sobre styles.css */
    .header-tools{display:flex;gap:.6rem}
    .cover{
      aspect-ratio:16/9; background:#0e0f12; border-bottom:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;overflow:hidden
    }
    .cover img{width:100%;height:100%;object-fit:cover;filter:saturate(.98)}
    .article{
      display:grid;grid-template-columns:1fr 320px;gap:1.4rem;padding:1.2rem 0
    }
    .main{
      background:var(--card);border:1px solid var(--border);border-radius:.9rem;overflow:hidden
    }
    .content{padding:1rem 1.1rem}
    .kicker{display:inline-block;background:rgba(255,255,255,.08);border:1px solid var(--border);padding:.2rem .45rem;border-radius:.4rem;font-weight:800;font-size:.8rem}
    h1{margin:.4rem 0 .5rem;font-size:1.8rem;line-height:1.2}
    .meta{color:var(--muted);display:flex;gap:.6rem;flex-wrap:wrap;font-size:.95rem}
    .md-content{margin-top:1rem}
    .md-content h2{font-size:1.4rem;margin:1.2rem 0 .4rem}
    .md-content h3{font-size:1.15rem;margin:1rem 0 .3rem}
    .md-content p{color:#d8d8de;margin:.6rem 0}
    .md-content ul,.md-content ol{padding-left:1.2rem}
    .md-content code{background:#12141b;border:1px solid var(--border);padding:.15rem .35rem;border-radius:.3rem}
    .md-content pre{background:#0f1116;border:1px solid var(--border);padding:1rem;border-radius:.6rem;overflow:auto}
    .badge{font-size:.75rem;background:rgba(0,0,0,.5);border:1px solid var(--border);padding:.2rem .45rem;border-radius:.4rem;font-weight:700}
    .badges{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
    .sidebar{position:sticky;top:76px;height:fit-content;display:grid;gap:1rem}
    .box{background:var(--card);border:1px solid var(--border);border-radius:.9rem;padding:1rem}
    .author{display:flex;gap:.6rem;align-items:center}
    .author img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}
    .list{display:grid;gap:.7rem}
    .item{display:grid;grid-template-columns:96px 1fr;gap:.6rem;align-items:center}
    .item img{width:100%;height:64px;object-fit:cover;border-radius:.4rem;border:1px solid var(--border)}
    .empty{border:1px dashed var(--border);border-radius:.7rem;padding:1rem;text-align:center;color:var(--muted)}
    .skeleton{position:relative;overflow:hidden;background:#141519}
    .skeleton::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);animation:shimmer 1.2s infinite}
    @keyframes shimmer{100%{transform:translateX(100%)}}
    @media (max-width:980px){.article{grid-template-columns:1fr}}
  </style>
  <script src="img-fallback.js"></script>

{

      "@type": "WebSite",
      "@id": "https://flloydinn.netlify.app/#website",

      "name": "Flloydinn",
      "alternateName": "Flloydinn Gameplay",
      "inLanguage": "pt-BR",

      },

</head>
<body>
  <!-- Header -->
  <site-header></site-header>

  <!-- Capa -->
  <div id="cover" class="cover skeleton" aria-label="Imagem de capa do post"></div>

  <!-- Artigo -->
  <main class="container article">
    <article class="main">
      <div class="content">
        <span id="category" class="kicker">Carregando</span>
        <h1 id="title">Carregando post</h1>
        <p class="meta" id="meta">...</p>
        <div id="tags" class="badges"></div>
        <div id="content" class="md-content"></div>
      </div>
    </article>

    <aside class="sidebar">
      <section class="box">
        <div class="author">
          <img id="authorImg" src="assets/avatar.jpg" alt="Foto do autor">
          <div>
            <strong id="authorName">Autor</strong>
            <div style="color:var(--muted);font-size:.9rem" id="authorRole">Redação</div>
          </div>
        </div>
        <p style="margin:.7rem 0 0;color:var(--muted)">Compartilhe com a comunidade e marque @flloydinn</p>
      </section>

      <section class="box">
        <h3 style="margin:.2rem 0 .6rem">Mais recentes</h3>
        <div id="recentList" class="list"></div>
      </section>
    </aside>
  </main>

  <site-footer></site-footer>

  <script>
    // Util básico
    const $ = sel => document.querySelector(sel);
    const fmtDate = iso => new Date(iso).toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric' });
    const readLabel = m => `${m} min de leitura`;

    // Markdown parser leve (suporta títulos, negrito, itálico, code, blocos de código, listas, links, imagens)
    function mdToHtml(md){
      // Escapa HTML
      md = md.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      // Code block ```
      md = md.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.replace(/\n$/,'')}</code></pre>`);
      // Headings
      md = md.replace(/^### (.*)$/gm, '<h3>$1</h3>');
      md = md.replace(/^## (.*)$/gm, '<h2>$1</h2>');
      md = md.replace(/^# (.*)$/gm, '<h1>$1</h1>');
      // Bold, italic, inline code
      md = md.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      md = md.replace(/\*(.*?)\*/g, '<em>$1</em>');
      md = md.replace(/`([^`]+)`/g, '<code>$1</code>');
      // Imagens ![alt](src)
      md = md.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2">');
      // Links [text](url)
      md = md.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      // Listas
      md = md.replace(/^\s*-\s+(.*)$/gm, '<li>$1</li>');
      md = md.replace(/(<li>.*<\/li>)(?!\n<li>)/gs, '<ul>$1</ul>');
      // Parágrafos
      md = md.replace(/^(?!<h\d|<ul|<pre|<img|<p|<blockquote)([^\n]+)\n?/gm, '<p>$1</p>');
      return md;
    }

    // Lê parâmetros
    const params = new URLSearchParams(location.search);
    const slug = params.get('slug');

    // Render default data

    async function loadIndex(){
      const res = await fetch('posts/index.json', { cache: 'no-cache' });
      if(!res.ok) throw new Error('Não foi possível carregar posts/index.json');
      return res.json();
    }

    function renderRecent(list, currentSlug){
      const recent = [...list].sort((a,b)=> new Date(b.dateISO) - new Date(a.dateISO)).slice(0,5);
      $('#recentList').innerHTML = recent.map(p=>`
        <a class="item" href="post.html?slug=${encodeURIComponent(p.slug)}" aria-label="${p.title}">
          <img src="${p.cover}" alt="${p.title}">
          <div>
            <strong>${p.title}</strong>
            <div style="color:var(--muted);font-size:.9rem">${fmtDate(p.dateISO)} • ${p.category}</div>
          </div>
        </a>
      `).join('');
    }

    // ===== SEO por artigo =====
    // post.html serve todos os artigos, então canonical/og:url não podem ser fixos no HTML
    // (todos os posts virariam "a mesma página"). O Google executa JS e lê estes valores.
    const SITE_BASE = 'https://flloydinn.netlify.app';
    function setHeadTag(selector, create, attrs){
      let el = document.head.querySelector(selector);
      if(!el){ el = document.createElement(create); document.head.appendChild(el); }
      Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k, v));
    }
    const DEFAULT_OG_IMG = `${SITE_BASE}/assets/og-flloydinn.jpg`;
    /** capa do post em URL absoluta, só se for um caminho seguro do próprio site (ou https) */
    function absCover(c){
      c = String(c || '').trim();
      if(/^https:\/\/[^\s"'<>]+$/.test(c)) return c;
      if(/^(assets|posts)\/[\w\/.-]+\.(jpe?g|png|webp)$/i.test(c)) return `${SITE_BASE}/${c}`;
      return '';
    }
    function setOgImage(src){
      setHeadTag('meta[property="og:image"]', 'meta', { property:'og:image', content:src });
      setHeadTag('meta[name="twitter:image"]', 'meta', { name:'twitter:image', content:src });
      if(src === DEFAULT_OG_IMG){
        setHeadTag('meta[property="og:image:width"]', 'meta', { property:'og:image:width', content:'1200' });
        setHeadTag('meta[property="og:image:height"]', 'meta', { property:'og:image:height', content:'630' });
      } else {
        // tamanho da capa é desconhecido: remove width/height da imagem padrão para não declarar errado
        document.head.querySelectorAll('meta[property="og:image:width"],meta[property="og:image:height"]').forEach(m => m.remove());
      }
    }
    /** JSON-LD BlogPosting do artigo carregado (substitui o anterior, se houver) */
    function setPostLD(post, url, image){
      const ld = {
        "@context":"https://schema.org", "@type":"BlogPosting",
        "@id": url + "#article", "mainEntityOfPage": url, "url": url,
        "headline": String(post.title).slice(0, 110),
        "description": post.excerpt || undefined,
        "image": [image],
        "datePublished": /^\d{4}-\d{2}-\d{2}/.test(post.dateISO || '') ? post.dateISO : undefined,
        "inLanguage": "pt-BR",
        "author": { "@type": "Person", "name": post.author || "Flloydinn" },
        "publisher": { "@type": "Organization", "@id": `${SITE_BASE}/#org`, "name": "Flloydinn",
                       "logo": { "@type": "ImageObject", "url": `${SITE_BASE}/assets/apple-touch-icon.png` } },
        "isPartOf": { "@type": "Blog", "@id": `${SITE_BASE}/blog.html#blog`, "name": "Blog Flloydinn" },
        "keywords": Array.isArray(post.tags) && post.tags.length ? post.tags.join(', ') : undefined,
        "articleSection": post.category || undefined,
        "about": post.game ? { "@type": "VideoGame", "name": post.game } : undefined,
      };
      let el = document.getElementById('ld-post');
      if(!el){ el = document.createElement('script'); el.type = 'application/ld+json'; el.id = 'ld-post'; document.head.appendChild(el); }
      el.textContent = JSON.stringify(ld).replace(/</g, '\\u003c');
    }
    function applyPostSEO(post){
      const url = `${SITE_BASE}/post.html?slug=${encodeURIComponent(post.slug)}`;
      const title = `${post.title} — Blog Flloydinn`;
      const desc = post.excerpt || '';
      setHeadTag('link[rel="canonical"]', 'link', { rel:'canonical', href:url });
      setHeadTag('meta[property="og:url"]', 'meta', { property:'og:url', content:url });
      setHeadTag('meta[property="og:title"]', 'meta', { property:'og:title', content:title });
      setHeadTag('meta[name="twitter:title"]', 'meta', { name:'twitter:title', content:title });
      setHeadTag('meta[property="og:image:alt"]', 'meta', { property:'og:image:alt', content:`Capa: ${post.title}` });
      if(desc){
        setHeadTag('meta[name="description"]', 'meta', { name:'description', content:desc });
        setHeadTag('meta[property="og:description"]', 'meta', { property:'og:description', content:desc });
        setHeadTag('meta[name="twitter:description"]', 'meta', { name:'twitter:description', content:desc });
      }
      if(post.dateISO) setHeadTag('meta[property="article:published_time"]', 'meta', { property:'article:published_time', content:post.dateISO });
      // og:image = capa do post se ela existir de fato; senão, a imagem padrão da marca
      setOgImage(DEFAULT_OG_IMG);
      setPostLD(post, url, DEFAULT_OG_IMG);
      const cover = absCover(post.cover);
      if(cover){
        const probe = new Image();
        probe.onload = () => { if(probe.naturalWidth > 0){ setOgImage(cover); setPostLD(post, url, cover); } };
        probe.src = cover.replace(SITE_BASE + '/', '');
      }
    }
    // Slug ausente/inexistente: não indexar a página de erro
    const markNoIndex = () => setHeadTag('meta[name="robots"]', 'meta', { name:'robots', content:'noindex' });

    async function renderPost(){
      const data = await loadIndex();

      if(!slug){
        document.title = 'Post não encontrado';
        markNoIndex();
        $('#content').innerHTML = '<div class="empty">Defina ?slug=meu-artigo na URL.</div>';
        return;
      }

      const post = data.posts.find(p => p.slug === slug);
      if(!post){
        document.title = 'Post não encontrado';
        markNoIndex();
        $('#content').innerHTML = '<div class="empty">Este artigo não existe no index.json.</div>';
        return;
      }

      // Meta
      document.title = `${post.title} — Blog Flloydinn`;
      applyPostSEO(post);
      $('#category').textContent = post.category || 'Artigo';
      $('#title').textContent = post.title;
      $('#meta').textContent = `${fmtDate(post.dateISO)} • ${readLabel(post.readMin||5)} • ${post.author||'Redação'}`;
      $('#tags').innerHTML = (post.tags||[]).map(t=>`<span class="badge">#${t}</span>`).join('');
      $('#authorName').textContent = post.author || 'Redação';
      $('#authorRole').textContent = post.author === 'Flloydinn' ? 'Autor' : 'Redação';

      // Capa
      const cover = document.createElement('img');
      cover.src = post.cover;
      cover.alt = post.title;
      const coverBox = document.getElementById('cover');
      coverBox.classList.remove('skeleton');
      coverBox.innerHTML = '';
      coverBox.appendChild(cover);

      // Conteúdo MD
      const mdUrl = `posts/${post.file}`;
      const res = await fetch(mdUrl, { cache: 'no-cache' });
      if(!res.ok){
        $('#content').innerHTML = '<div class="empty">Conteúdo não encontrado para este post.</div>';
      } else {
        const md = await res.text();
        $('#content').innerHTML = mdToHtml(md);
      }

      // Recentes
      renderRecent(data.posts, slug);
    }

    // Inicia
    renderPost().catch(err=>{
      console.error(err);
      $('#content').innerHTML = '<div class="empty">Erro ao carregar o post.</div>';
    });
  </script>
</body>
</html>
