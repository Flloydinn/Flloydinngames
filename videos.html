<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Flloydinn Gameplay — Vídeos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Biblioteca de vídeos do canal Flloydinn Gameplay com busca, filtros e categorias.">
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0b0b0c;
      --bg-soft:#121316;
      --text:#E8E8EA;
      --muted:#A6A6AD;
      --brand:#8f0000;
      --brand-2:#ffffff;
      --card:#1a1a1a;
      --border:#24262b;
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --ok:#57d996;
      --warn:#ffb84d;
      --danger:#ff6b6b;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:linear-gradient(180deg,#0b0b0c 0%, #0d0e12 40%, #0b0b0c 100%);
      line-height:1.55;
    }
    img{max-width:100%;display:block}
    a{color:var(--brand-2);text-decoration:none}
    .container{width:min(1200px,calc(100% - 2rem));margin:0 auto}
    .site-header{
      position:sticky;top:0;z-index:50;
      background:rgba(11,11,12,.7);backdrop-filter:blur(6px);
      border-bottom:1px solid var(--border);
    }
    .nav{display:flex;align-items:center;justify-content:space-between;padding:.9rem 0;gap:1rem}
    .brand{font-weight:800;letter-spacing:.3px}
    .brand .logo{font-size:1.2rem}
    .brand .logo span{color:var(--brand)}
    .btn{
      background:linear-gradient(135deg,var(--brand) 0%,#b31212 100%);
      color:#fff;border:0;border-radius:.6rem;
      padding:.65rem 1rem;font-weight:600;box-shadow:var(--shadow);
      cursor:pointer;transition:transform .15s ease,opacity .2s ease;
    }
    .btn:hover{transform:translateY(-2px)}
    .btn--ghost{background:transparent;border:1px solid var(--border)}
    .btn--small{padding:.5rem .75rem;font-size:.9rem}
    .toolbar{
      position:sticky;top:56px;z-index:40;
      background:rgba(16,16,18,.9);backdrop-filter:blur(6px);
      border-bottom:1px solid var(--border);
    }
    .toolbar__inner{
      display:grid;grid-template-columns:1.2fr .8fr;gap:1rem;align-items:center;padding:1rem 0;
    }
    .searchbox{
      display:flex;gap:.6rem;align-items:center;background:var(--card);
      border:1px solid var(--border);border-radius:.8rem;padding:.5rem .7rem;
    }
    .searchbox input{
      flex:1;background:transparent;border:0;outline:0;color:var(--text);
      font-size:1rem;padding:.35rem;
    }
    .filters{
      display:flex;gap:.6rem;flex-wrap:wrap;justify-content:flex-end;
    }
    .select, .chip, .toggle{
      background:var(--card);border:1px solid var(--border);color:var(--text);
      border-radius:.6rem; padding:.55rem .7rem; font-weight:600; cursor:pointer;
    }
    .select{padding:.55rem .9rem}
    .chip{font-size:.9rem;opacity:.9}
    .chip.is-active{outline:2px solid rgba(255,255,255,.12);opacity:1}
    .grid{
      display:grid;gap:1rem;
      grid-template-columns:repeat(6,1fr);
      padding:1.2rem 0 2rem;
    }
    .card{
      position:relative;overflow:hidden;border-radius:.8rem;background:var(--card);
      border:1px solid var(--border);box-shadow:var(--shadow);
      display:flex;flex-direction:column;
    }
    .thumb{
      position:relative;aspect-ratio:16/9;overflow:hidden;background:#0e0f12;
    }
    .thumb img{
      width:100%;height:100%;object-fit:cover;filter:saturate(.95) contrast(1.05);
      transition:transform .25s ease;
    }
    .card:hover .thumb img{transform:scale(1.04)}
    .badge-row{
      position:absolute;inset:auto .6rem .6rem .6rem;display:flex;gap:.4rem;flex-wrap:wrap;
    }
    .badge{
      background:rgba(0,0,0,.55);border:1px solid var(--border);
      padding:.2rem .45rem;border-radius:.4rem;font-size:.75rem;font-weight:700
    }
    .meta{
      display:flex;align-items:center;gap:.6rem;color:var(--muted);font-size:.85rem;margin-top:.15rem;flex-wrap:wrap
    }
    .body{padding:.8rem .9rem 1rem}
    .title{
      margin:0 0 .2rem;font-size:1rem;line-height:1.35;font-weight:700;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    }
    .actions{
      display:flex;gap:.5rem;margin-top:.6rem
    }
    .btn--play{flex:1;display:inline-flex;justify-content:center}
    .btn--save{background:transparent;border:1px solid var(--border)}
    .empty{
      border:1px dashed var(--border);border-radius:.8rem;padding:2rem;text-align:center;color:var(--muted)
    }
    .controls{
      display:flex;justify-content:center;gap:.6rem;padding:1rem 0 2rem
    }
    .controls .btn[disabled]{opacity:.5;cursor:not-allowed}
    .legend{color:var(--muted);font-size:.9rem;margin:.4rem 0 0}
    .section{padding:1rem 0 0;border-top:1px solid var(--border)}
    /* Modal */
    .modal{
      position:fixed;inset:0;display:none;place-items:center;z-index:100;
      background:rgba(0,0,0,.7);padding:1rem;
    }
    .modal.open{display:grid}
    .modal__dialog{
      width:min(1100px,100%);background:var(--bg-soft);border:1px solid var(--border);
      border-radius:.8rem;box-shadow:var(--shadow);overflow:hidden
    }
    .modal__head{
      display:flex;align-items:center;justify-content:space-between;
      padding:.7rem .9rem;border-bottom:1px solid var(--border)
    }
    .modal__title{margin:0;font-size:1rem}
    .modal__body{aspect-ratio:16/9;background:#000}
    .modal__body iframe{width:100%;height:100%;display:block}
    /* Skeletons */
    .skeleton{position:relative;overflow:hidden;background:#141519}
    .skeleton::after{
      content:"";position:absolute;inset:0;transform:translateX(-100%);
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.05), transparent);
      animation:shimmer 1.2s infinite;
    }
    @keyframes shimmer{100%{transform:translateX(100%)}}
    /* Responsive */
    @media (max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}
    @media (max-width:820px){
      .toolbar__inner{grid-template-columns:1fr}
      .filters{justify-content:flex-start}
      .grid{grid-template-columns:repeat(3,1fr)}
    }
    @media (max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="#" aria-label="Flloydinn Gameplay">
        <span class="logo">Flloyd<span>inn</span> Gameplay</span>
      </a>
      <nav class="menu" aria-label="principal">
        <a class="btn btn--ghost btn--small" href="index.html">Início</a>
        <a class="btn btn--small" href="#videos">Vídeos</a>
      </nav>
    </div>
  </header>

  <!-- Toolbar -->
  <div class="toolbar" role="region" aria-label="Controles de busca e filtros">
    <div class="container toolbar__inner">
      <div class="searchbox" role="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 21l-4.2-4.2M10.8 18.6a7.8 7.8 0 1 1 0-15.6 7.8 7.8 0 0 1 0 15.6Z" stroke="#A6A6AD" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Buscar por título, jogo ou palavra chave..." autocomplete="off" />
        <button id="clearBtn" class="btn btn--ghost btn--small" aria-label="Limpar busca">Limpar</button>
      </div>
      <div class="filters">
        <select id="sort" class="select" aria-label="Ordenar">
          <option value="recent">Mais recentes</option>
          <option value="views">Mais vistos</option>
          <option value="durationAsc">Duração menor</option>
          <option value="durationDesc">Duração maior</option>
          <option value="title">Título A-Z</option>
        </select>
        <select id="duration" class="select" aria-label="Filtrar por duração">
          <option value="all">Todas as durações</option>
          <option value="short">Curtos até 5 min</option>
          <option value="medium">5 a 20 min</option>
          <option value="long">Mais de 20 min</option>
        </select>
        <select id="type" class="select" aria-label="Tipo de conteúdo">
          <option value="all">Todos os tipos</option>
          <option value="video">Vídeo</option>
          <option value="short">Short</option>
          <option value="live">Live</option>
          <option value="serie">Série</option>
          <option value="clipe">Clipe</option>
        </select>
      </div>
    </div>
    <div class="container section" aria-label="Categorias">
      <div id="chips" class="filters" role="listbox" aria-label="Categorias por jogo"></div>
      <p class="legend" id="legend"></p>
    </div>
  </div>

  <!-- Grid -->
  <main id="videos" class="container" style="padding-top:1rem">
    <section id="grid" class="grid" aria-live="polite"></section>
    <div class="controls">
      <button id="prev" class="btn btn--ghost">Anterior</button>
      <button id="next" class="btn">Próxima</button>
    </div>
  </main>

  <!-- Modal Player -->
  <div id="modal" class="modal" aria-hidden="true" aria-labelledby="mtitle" role="dialog">
    <div class="modal__dialog">
      <div class="modal__head">
        <h2 id="mtitle" class="modal__title">Assistir</h2>
        <button id="mclose" class="btn btn--ghost btn--small" aria-label="Fechar">Fechar</button>
      </div>
      <div class="modal__body" id="mbody" aria-label="Player de vídeo"></div>
    </div>
  </div>

  <script>
    // ===== Dataset de exemplo =====
    // Campos: id, youtubeId, title, game, categories, type, durationMin, views, dateISO, thumb
    const SAMPLE = [
      {id:1,youtubeId:"CYbAoKRh8JA",title:"Coop Caótico: primeiras vitórias",game:"Overcooked 2",categories:["Coop","Diversão"],type:"video",durationMin:12,views:1200,dateISO:"2025-08-12",thumb:"assets/game2.jpg"},
      {id:2,youtubeId:"dQw4w9WgXcQ",title:"Aventura Insana parte 1",game:"Elden Ring",categories:["Aventura","Desafio"],type:"serie",durationMin:28,views:980,dateISO:"2025-07-30",thumb:"assets/game1.jpg"},
      {id:3,youtubeId:"r1G1JkqQ4",title:"Indie surpresa em 10 minutos",game:"Hades",categories:["Indie","Rápido"],type:"short",durationMin:3,views:4200,dateISO:"2025-08-28",thumb:"assets/game3.jpg"},
      {id:4,youtubeId:"V-_O7nl0Ii0",title:"Battle Royale com a galera",game:"Fortnite",categories:["Multiplayer"],type:"live",durationMin:95,views:2100,dateISO:"2025-09-02",thumb:"assets/game4.jpg"},
      {id:5,youtubeId:"kXYiU_JCYtU",title:"Clipes da semana",game:"Vários",categories:["Clipes"],type:"clipe",durationMin:8,views:1550,dateISO:"2025-09-05",thumb:"assets/game6.jpg"},
      {id:6,youtubeId:"3JZ_D3ELwOQ",title:"Noite de terror",game:"Phasmophobia",categories:["Terror"],type:"video",durationMin:22,views:865,dateISO:"2025-08-15",thumb:"assets/game5.jpg"},
      {id:7,youtubeId:"oHg5SJYRHA0",title:"Série Soulslike parte 2",game:"Elden Ring",categories:["Aventura","Desafio"],type:"serie",durationMin:31,views:640,dateISO:"2025-08-05",thumb:"assets/game1.jpg"},
      {id:8,youtubeId:"M7lc1UVf-VE",title:"Coop de chorar de rir",game:"Gang Beasts",categories:["Coop","Diversão"],type:"video",durationMin:16,views:1330,dateISO:"2025-09-07",thumb:"assets/game2.jpg"},
      {id:9,youtubeId:"5NV6Rdv1a3I",title:"Short: momento épico",game:"Apex Legends",categories:["Clipes"],type:"short",durationMin:1,views:5200,dateISO:"2025-09-09",thumb:"assets/game4.jpg"},
      {id:10,youtubeId:"FTQbiNvZqaY",title:"Live especial com inscritos",game:"Minecraft",categories:["Multiplayer"],type:"live",durationMin:120,views:3400,dateISO:"2025-08-20",thumb:"assets/game6.jpg"},
      {id:11,youtubeId:"Zi_XLOBDo_Y",title:"Indie roguelike em alta",game:"Dead Cells",categories:["Indie"],type:"video",durationMin:18,views:760,dateISO:"2025-07-21",thumb:"assets/game3.jpg"},
      {id:12,youtubeId:"kJQP7kiw5Fk",title:"Corrida maluca com a comunidade",game:"Trackmania",categories:["Corrida","Multiplayer"],type:"video",durationMin:14,views:1500,dateISO:"2025-08-26",thumb:"assets/game6.jpg"},
      {id:13,youtubeId:"eY52Zsg-KVI",title:"Clipes: melhores fails",game:"Vários",categories:["Clipes","Diversão"],type:"clipe",durationMin:7,views:2100,dateISO:"2025-06-28",thumb:"assets/game5.jpg"},
      {id:14,youtubeId:"2vjPBrBU-TM",title:"Short: boss deleteado",game:"Elden Ring",categories:["Aventura"],type:"short",durationMin:0.8,views:6100,dateISO:"2025-08-29",thumb:"assets/game1.jpg"},
      {id:15,youtubeId:"hY7m5jjJ9mM",title:"Live maratona 2 horas",game:"Valorant",categories:["FPS","Multiplayer"],type:"live",durationMin:132,views:2700,dateISO:"2025-09-01",thumb:"assets/game4.jpg"},
      {id:16,youtubeId:"tVj0ZTS4WF4",title:"Guia rápido para iniciantes",game:"Fortnite",categories:["Dica"],type:"video",durationMin:9,views:3200,dateISO:"2025-08-10",thumb:"assets/game4.jpg"},
      {id:17,youtubeId:"9bZkp7q19f0",title:"Série Soulslike parte 3",game:"Elden Ring",categories:["Aventura","Desafio"],type:"serie",durationMin:29,views:710,dateISO:"2025-08-18",thumb:"assets/game1.jpg"},
      {id:18,youtubeId:"60ItHLz5WEA",title:"Short: combo perfeito",game:"Hades",categories:["Indie","Clipes"],type:"short",durationMin:0.7,views:4550,dateISO:"2025-09-03",thumb:"assets/game3.jpg"}
    ];

    // ===== Estado e elementos =====
    const elGrid = document.getElementById('grid');
    const elChips = document.getElementById('chips');
    const elLegend = document.getElementById('legend');
    const elQ = document.getElementById('q');
    const elClear = document.getElementById('clearBtn');
    const elSort = document.getElementById('sort');
    const elDuration = document.getElementById('duration');
    const elType = document.getElementById('type');
    const elPrev = document.getElementById('prev');
    const elNext = document.getElementById('next');

    const state = {
      q: "",
      type: "all",
      duration: "all",
      sort: "recent",
      category: "todas",
      page: 1,
      perPage: 12
    };

    // ===== Util =====
    const fmtViews = n => n >= 1000 ? (n/1000).toFixed(n%1000===0?0:1).replace('.', ',') + ' mil' : String(n);
    const fmtDate = iso => new Date(iso).toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric' });
    const minutesToLabel = m => (m<1?`${Math.round(m*60)}s`:`${Math.round(m)} min`);

    // ===== Categorias dinâmicas (por jogo) =====
    const GAMES = Array.from(new Set(SAMPLE.map(v => v.game)));
    function renderChips(){
      const all = ["todas", ...GAMES];
      elChips.innerHTML = "";
      all.forEach(g => {
        const b = document.createElement('button');
        b.className = 'chip' + (state.category===g?' is-active':'');
        b.role = 'option';
        b.ariaSelected = state.category===g ? 'true':'false';
        b.textContent = g;
        b.addEventListener('click', ()=>{
          state.category = g;
          state.page = 1;
          update();
        });
        elChips.appendChild(b);
      });
    }

    // ===== Filtro principal =====
    function applyFilters(){
      const q = state.q.trim().toLowerCase();
      let list = SAMPLE.filter(v=>{
        const matchesQ = !q || [v.title, v.game, ...(v.categories||[])].join(' ').toLowerCase().includes(q);
        const matchesType = state.type==='all' || v.type===state.type;
        const matchesCat = state.category==='todas' || v.game===state.category;
        const matchesDuration =
          state.duration==='all' ||
          (state.duration==='short' && v.durationMin<=5) ||
          (state.duration==='medium' && v.durationMin>5 && v.durationMin<=20) ||
          (state.duration==='long' && v.durationMin>20);
        return matchesQ && matchesType && matchesCat && matchesDuration;
      });

      switch(state.sort){
        case 'recent': list.sort((a,b)=> new Date(b.dateISO)-new Date(a.dateISO)); break;
        case 'views': list.sort((a,b)=> b.views - a.views); break;
        case 'durationAsc': list.sort((a,b)=> a.durationMin - b.durationMin); break;
        case 'durationDesc': list.sort((a,b)=> b.durationMin - a.durationMin); break;
        case 'title': list.sort((a,b)=> a.title.localeCompare(b.title)); break;
      }
      return list;
    }

    // ===== Render =====
    function renderSkeletons(count=8){
      elGrid.innerHTML = "";
      for(let i=0;i<count;i++){
        const c = document.createElement('article');
        c.className = 'card';
        c.innerHTML = `
          <div class="thumb skeleton"></div>
          <div class="body">
            <div class="skeleton" style="height:18px;border-radius:.4rem;margin-bottom:.5rem"></div>
            <div class="skeleton" style="height:14px;border-radius:.4rem;width:60%"></div>
          </div>`;
        elGrid.appendChild(c);
      }
    }

    function renderGrid(items){
      const start = (state.page-1)*state.perPage;
      const end = start + state.perPage;
      const pageItems = items.slice(start,end);

      if(pageItems.length===0){
        elGrid.innerHTML = `<div class="empty">Nenhum resultado encontrado. Tente ajustar filtros ou termos de busca.</div>`;
        elLegend.textContent = "";
        elPrev.disabled = true; elNext.disabled = true;
        return;
      }

      elGrid.innerHTML = pageItems.map(v=>`
        <article class="card" data-id="${v.id}">
          <div class="thumb">
            <img src="${v.thumb}" alt="${v.title}">
            <div class="badge-row">
              <span class="badge">${v.type.toUpperCase()}</span>
              <span class="badge">${minutesToLabel(v.durationMin)}</span>
            </div>
          </div>
          <div class="body">
            <h3 class="title" title="${v.title}">${v.title}</h3>
            <div class="meta">
              <span>${v.game}</span>
              <span aria-hidden="true">•</span>
              <span>${fmtViews(v.views)} views</span>
              <span aria-hidden="true">•</span>
              <time datetime="${v.dateISO}">${fmtDate(v.dateISO)}</time>
            </div>
            <div class="actions">
              <button class="btn btn--play" data-play="${v.youtubeId}" aria-label="Assistir ${v.title}">Assistir</button>
              <button class="btn btn--save btn--small" data-save="${v.id}" aria-label="Salvar para depois">Salvar</button>
            </div>
          </div>
        </article>
      `).join('');

      // Legenda
      const total = items.length;
      const showing = `${start+1} a ${Math.min(end,total)}`;
      elLegend.textContent = `Exibindo ${showing} de ${total} vídeos`;

      // Paginação
      elPrev.disabled = state.page===1;
      elNext.disabled = end >= items.length;

      // Delegação de eventos
      elGrid.querySelectorAll('[data-play]').forEach(btn=>{
        btn.addEventListener('click', ()=> openModal(btn.dataset.play, btn.closest('.card').querySelector('.title').textContent));
      });
      elGrid.querySelectorAll('[data-save]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          btn.textContent = 'Salvo';
          btn.style.borderColor = 'transparent';
          btn.style.background = 'linear-gradient(135deg, var(--ok) 0%, #79e7b1 100%)';
          btn.setAttribute('aria-pressed','true');
        });
      });
    }

    // ===== Modal Player =====
    const modal = document.getElementById('modal');
    const mbody = document.getElementById('mbody');
    const mtitle = document.getElementById('mtitle');
    const mclose = document.getElementById('mclose');
    let lastFocus = null;

    function openModal(youtubeId, title){
      lastFocus = document.activeElement;
      mtitle.textContent = title;
      mbody.innerHTML = `<iframe src="https://www.youtube.com/embed/${youtubeId}?autoplay=1" title="${title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
      modal.classList.add('open');
      modal.setAttribute('aria-hidden','false');
      mclose.focus();
    }
    function closeModal(){
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden','true');
      mbody.innerHTML = "";
      if(lastFocus) lastFocus.focus();
    }
    mclose.addEventListener('click', closeModal);
    modal.addEventListener('click', e=>{ if(e.target===modal) closeModal(); });
    window.addEventListener('keydown', e=>{ if(e.key==='Escape' && modal.classList.contains('open')) closeModal(); });

    // ===== Bind Controles =====
    elQ.addEventListener('input', debounce(()=>{
      state.q = elQ.value; state.page = 1; update();
    }, 200));
    elClear.addEventListener('click', ()=>{
      elQ.value = ""; state.q = ""; state.page = 1; update();
      elQ.focus();
    });
    elSort.addEventListener('change', ()=>{ state.sort = elSort.value; state.page = 1; update(); });
    elDuration.addEventListener('change', ()=>{ state.duration = elDuration.value; state.page = 1; update(); });
    elType.addEventListener('change', ()=>{ state.type = elType.value; state.page = 1; update(); });
    elPrev.addEventListener('click', ()=>{ if(state.page>1){ state.page--; update(); } });
    elNext.addEventListener('click', ()=>{ state.page++; update(); });

    // ===== Debounce =====
    function debounce(fn, wait){
      let t; return (...args)=>{ clearTimeout(t); t = setTimeout(()=>fn(...args), wait); };
    }

    // ===== URL Sync (opcional) =====
    function syncFromURL(){
      const p = new URLSearchParams(location.search);
      state.q = p.get('q') || state.q;
      state.type = p.get('type') || state.type;
      state.duration = p.get('dur') || state.duration;
      state.sort = p.get('sort') || state.sort;
      state.category = p.get('cat') || state.category;
      state.page = parseInt(p.get('page')||state.page,10);
      // Preencher inputs
      elQ.value = state.q;
      elSort.value = state.sort;
      elDuration.value = state.duration;
      elType.value = state.type;
    }
    function pushURL(){
      const p = new URLSearchParams();
      if(state.q) p.set('q',state.q);
      if(state.type!=='all') p.set('type',state.type);
      if(state.duration!=='all') p.set('dur',state.duration);
      if(state.sort!=='recent') p.set('sort',state.sort);
      if(state.category!=='todas') p.set('cat',state.category);
      if(state.page!==1) p.set('page',String(state.page));
      const query = p.toString();
      const url = query ? `?${query}` : location.pathname;
      history.replaceState(null,'',url);
    }

    // ===== Update =====
    function update(){
      renderChips();
      renderSkeletons(6);
      requestAnimationFrame(()=>{
        const filtered = applyFilters();
        renderGrid(filtered);
        pushURL();
      });
    }

    // ===== Inicialização =====
    (function init(){
      syncFromURL();
      renderChips();
      update();
    })();
