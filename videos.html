  <style>
    body{line-height:1.55} /* ajuste desta página sobre styles.css */
    a{color:var(--brand-2)} /* ajuste desta página sobre styles.css */
    .btn{padding:.65rem 1rem;font-weight:600} /* ajuste desta página sobre styles.css */
    .btn--small{padding:.5rem .75rem} /* ajuste desta página sobre styles.css */
    .toolbar{
      position:sticky;top:56px;z-index:40;
      background:rgba(16,16,18,.9);backdrop-filter:blur(6px);
      border-bottom:1px solid var(--border);
    }
    .toolbar__inner{
      display:grid;grid-template-columns:1.2fr .8fr;gap:1rem;align-items:center;padding:1rem 0;
    }
    .searchbox{
      display:flex;gap:.6rem;align-items:center;background:var(--card);
      border:1px solid var(--border);border-radius:.8rem;padding:.5rem .7rem;
    }
    .searchbox input{
      flex:1;background:transparent;border:0;outline:0;color:var(--text);
      font-size:1rem;padding:.35rem;
    }
    .filters{
      display:flex;gap:.6rem;flex-wrap:wrap;justify-content:flex-end;
    }
    .select, .chip, .toggle{
      background:var(--card);border:1px solid var(--border);color:var(--text);
      border-radius:.6rem; padding:.55rem .7rem; font-weight:600; cursor:pointer;
    }
    .select{padding:.55rem .9rem}
    .chip{font-size:.9rem;opacity:.9}
    .chip.is-active{outline:2px solid rgba(255,255,255,.12);opacity:1}
    .grid{
      display:grid;gap:1rem;
      grid-template-columns:repeat(6,1fr);
      padding:1.2rem 0 2rem;
    }
    .card{
      position:relative;overflow:hidden;border-radius:.8rem;background:var(--card);
      border:1px solid var(--border);box-shadow:var(--shadow);
      display:flex;flex-direction:column;
    }
    .thumb{
      position:relative;aspect-ratio:16/9;overflow:hidden;background:#0e0f12;
    }
    .thumb img{
      width:100%;height:100%;object-fit:cover;filter:saturate(.95) contrast(1.05);
      transition:transform .25s ease;
    }
    .card:hover .thumb img{transform:scale(1.04)}
    .badge-row{
      position:absolute;inset:auto .6rem .6rem .6rem;display:flex;gap:.4rem;flex-wrap:wrap;
    }
    .badge{
      background:rgba(0,0,0,.55);border:1px solid var(--border);
      padding:.2rem .45rem;border-radius:.4rem;font-size:.75rem;font-weight:700
    }
    .meta{
      display:flex;align-items:center;gap:.6rem;color:var(--muted);font-size:.85rem;margin-top:.15rem;flex-wrap:wrap
    }
    .body{padding:.8rem .9rem 1rem}
    .title{
      margin:0 0 .2rem;font-size:1rem;line-height:1.35;font-weight:700;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    }
    .actions{
      display:flex;gap:.5rem;margin-top:.6rem
    }
    .btn--play{flex:1;display:inline-flex;justify-content:center}
    .btn--save{background:transparent;border:1px solid var(--border)}
    .empty{
      border:1px dashed var(--border);border-radius:.8rem;padding:2rem;text-align:center;color:var(--muted)
    }
    .controls{
      display:flex;justify-content:center;gap:.6rem;padding:1rem 0 2rem
    }
    .controls .btn[disabled]{opacity:.5;cursor:not-allowed}
    .legend{color:var(--muted);font-size:.9rem;margin:.4rem 0 0}
    .section{padding:1rem 0 0;border-top:1px solid var(--border)}
    /* Modal */
    .modal{
      position:fixed;inset:0;display:none;place-items:center;z-index:100;
      background:rgba(0,0,0,.7);padding:1rem;
    }
    .modal.open{display:grid}
    .modal__dialog{
      width:min(1100px,100%);background:var(--bg-soft);border:1px solid var(--border);
      border-radius:.8rem;box-shadow:var(--shadow);overflow:hidden
    }
    .modal__head{
      display:flex;align-items:center;justify-content:space-between;
      padding:.7rem .9rem;border-bottom:1px solid var(--border)
    }
    .modal__title{margin:0;font-size:1rem}
    .modal__body{aspect-ratio:16/9;background:#000}
    .modal__body iframe{width:100%;height:100%;display:block}
    /* Facade: thumbnail + play (o iframe do YouTube só carrega no clique) */
    .thumb__play{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.35));border:0;padding:0;cursor:pointer;color:#fff}
    .thumb__play svg{transition:transform .15s ease, filter .15s ease;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
    .thumb__play:hover svg,.thumb__play:focus-visible svg{transform:scale(1.1)}
    .thumb__play:focus-visible{outline:2px solid #fff;outline-offset:-4px}
    .btn--save.is-saved{border-color:transparent;background:linear-gradient(135deg, var(--ok) 0%, #79e7b1 100%);color:#0b0b0c}
    .notice{margin:.4rem 0 0;padding:.55rem .75rem;border:1px solid rgba(255,184,77,.35);background:rgba(255,184,77,.06);border-radius:.6rem;color:#ffe2a8;font-size:.9rem}
    .meta--stack{display:block}
    .meta__game{display:block;color:var(--text);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meta__stats{display:block;font-size:.8rem}
    /* Skeletons */
    .skeleton{position:relative;overflow:hidden;background:#141519}
    .skeleton::after{
      content:"";position:absolute;inset:0;transform:translateX(-100%);
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.05), transparent);
      animation:shimmer 1.2s infinite;
    }
    @keyframes shimmer{100%{transform:translateX(100%)}}
    /* Responsive */
    @media (max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}
    @media (max-width:820px){
      .toolbar__inner{grid-template-columns:1fr}
      .filters{justify-content:flex-start}
      .grid{grid-template-columns:repeat(3,1fr)}
    }
    @media (max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}

  <script>
    // ===== Dados do canal =====
    // data/videos.json é gerado por scripts/tv-playlist.mjs (GitHub Actions, diário) a partir do YouTube.
    // Nenhuma chave de API no site. Ordem de tentativa: catálogo -> playlist da TV -> reserva abaixo.
    const SOURCES = [['data/videos.json', 'catalogo'], ['tv/playlist.json', 'tv']];
    const FALLBACK = [
      { id:'qUu9A3DCDIQ', title:'ZOANDO NO MÁFIA III', published:'2022-01-12', dur:1112, type:'video', game:'Mafia III' },
      { id:'h3BVy54S2Eg', title:'FUGINDO DO PREDADOR COM ESTILO | Predator', published:'2021-09-30', dur:628, type:'video', game:'Predator' },
      { id:'-6PBG0gk2dQ', title:'O CARA MAIS CHATO DO JOGO! | Red Dead Online', published:'2021-07-18', dur:550, type:'video', game:'Red Dead Online' },
    ];
    const ID_RE = /^[A-Za-z0-9_-]{11}$/;
    const TYPE_LABEL = { video:'Vídeo', short:'Short', live:'Live' };
    const TYPE_PLURAL = { video:'Vídeos', short:'Shorts', live:'Lives' };
    let VIDEOS = [];
    let CHIP_GAMES = [];

    // ===== Elementos e estado =====
    const elGrid = document.getElementById('grid');
    const elChips = document.getElementById('chips');
    const elLegend = document.getElementById('legend');
    const elNotice = document.getElementById('dataNotice');
    const elQ = document.getElementById('q');
    const elClear = document.getElementById('clearBtn');
    const elSort = document.getElementById('sort');
    const elDuration = document.getElementById('duration');
    const elType = document.getElementById('type');
    const elPrev = document.getElementById('prev');
    const elNext = document.getElementById('next');

    const state = { q:"", type:"all", duration:"all", sort:"recent", category:"todas", page:1, perPage:12 };

    // ===== Util =====
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmtViews = n => n >= 1000 ? (n/1000).toFixed(n%1000===0?0:1).replace('.', ',') + ' mil' : String(n);
    const fmtDateShort = iso => iso ? new Date(iso + 'T12:00:00').toLocaleDateString('pt-BR') : '';
    const fmtDur = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
      return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };
    const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const saved = (() => { try { return new Set(JSON.parse(localStorage.getItem('fll_saved_videos') || '[]')); } catch { return new Set(); } })();
    const persistSaved = () => { try { localStorage.setItem('fll_saved_videos', JSON.stringify([...saved])); } catch {} };

    /** Normaliza um item do JSON; descarta qualquer coisa sem ID válido. A thumb é montada a partir do ID. */
    function normalize(v){
      if(!v || !ID_RE.test(String(v.id))) return null;
      const dur = Math.max(0, Math.round(Number(v.dur) || 0));
      return {
        id: String(v.id),
        title: String(v.title || 'Sem título'),
        game: String(v.game || 'Outros'),
        categories: Array.isArray(v.tags) ? v.tags.map(String) : [],
        description: String(v.description || ''),
        type: TYPE_LABEL[v.type] ? v.type : 'video',
        durationSec: dur, durationMin: dur/60,
        views: v.views != null && Number.isFinite(+v.views) ? +v.views : null,
        dateISO: /^\d{4}-\d{2}-\d{2}$/.test(String(v.published || '').slice(0,10)) ? String(v.published).slice(0,10) : '',
        thumb: `https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`,
        embeddable: v.embeddable !== false,
      };
    }

    async function loadCatalog(){
      for(const [url, src] of SOURCES){
        try{
          const r = await fetch(url, { cache:'no-cache' });
          if(!r.ok) continue;
          const d = await r.json();
          const list = (Array.isArray(d) ? d : (d.videos || [])).map(normalize).filter(Boolean);
          if(list.length) return { list, src };
        }catch(e){ /* tenta a próxima fonte */ }
      }
      return { list: FALLBACK.map(normalize), src: 'reserva' };
    }

    // ===== Filtros dinâmicos (a partir dos dados reais) =====
    function setupFilters(){
      // tipos que existem de fato, com contagem
      const counts = VIDEOS.reduce((c, v) => (c[v.type] = (c[v.type]||0) + 1, c), {});
      elType.innerHTML = '<option value="all">Todos os tipos</option>' +
        Object.keys(TYPE_PLURAL).filter(t => counts[t]).map(t => `<option value="${t}">${TYPE_PLURAL[t]} (${counts[t]})</option>`).join('');
      if(state.type !== 'all' && !counts[state.type]) state.type = 'all';
      elType.value = state.type;
      // "Mais vistos" só se houver visualizações
      const hasViews = VIDEOS.some(v => v.views != null);
      const optViews = elSort.querySelector('option[value="views"]');
      if(optViews){ optViews.hidden = !hasViews; optViews.disabled = !hasViews; }
      if(state.sort === 'views' && !hasViews) state.sort = 'recent';
      elSort.value = state.sort;
      // chips por jogo: todos se forem poucos; senão os que têm 2+ vídeos, e o resto em "Outros"
      const byGame = VIDEOS.reduce((c, v) => (v.game !== 'Outros' && (c[v.game] = (c[v.game]||0) + 1), c), {});
      const games = Object.keys(byGame).sort((a, b) => byGame[b] - byGame[a] || a.localeCompare(b, 'pt'));
      CHIP_GAMES = games.length <= 10 ? games : games.filter(g => byGame[g] >= 2);
      const valid = ['todas', 'Outros', ...CHIP_GAMES];
      if(!valid.includes(state.category)) state.category = 'todas';
    }
    const inOutros = v => !CHIP_GAMES.includes(v.game);

    function renderChips(){
      const all = ['todas', ...CHIP_GAMES, ...(VIDEOS.some(inOutros) ? ['Outros'] : [])];
      elChips.innerHTML = '';
      all.forEach(g => {
        const b = document.createElement('button');
        b.className = 'chip' + (state.category===g ? ' is-active' : '');
        b.setAttribute('role', 'option');
        b.setAttribute('aria-selected', state.category===g ? 'true' : 'false');
        b.textContent = g;
        b.addEventListener('click', ()=>{ state.category = g; state.page = 1; update(); });
        elChips.appendChild(b);
      });
    }

    // ===== Filtro principal =====
    function applyFilters(){
      const q = norm(state.q.trim());
      const list = VIDEOS.filter(v => {
        const matchesQ = !q || norm([v.title, v.game, v.description, ...v.categories].join(' ')).includes(q);
        const matchesType = state.type==='all' || v.type===state.type;
        const matchesCat = state.category==='todas' || (state.category==='Outros' ? inOutros(v) : v.game===state.category);
        const matchesDuration =
          state.duration==='all' ||
          (state.duration==='short' && v.durationMin<=5) ||
          (state.duration==='medium' && v.durationMin>5 && v.durationMin<=20) ||
          (state.duration==='long' && v.durationMin>20);
        return matchesQ && matchesType && matchesCat && matchesDuration;
      });
      switch(state.sort){
        case 'recent': list.sort((a,b)=> b.dateISO.localeCompare(a.dateISO)); break;
        case 'views': list.sort((a,b)=> (b.views ?? -1) - (a.views ?? -1)); break;
        case 'durationAsc': list.sort((a,b)=> a.durationSec - b.durationSec); break;
        case 'durationDesc': list.sort((a,b)=> b.durationSec - a.durationSec); break;
        case 'title': list.sort((a,b)=> a.title.localeCompare(b.title, 'pt')); break;
      }
      return list;
    }

    // ===== Render =====
    function renderSkeletons(count=8){
      elGrid.innerHTML = Array.from({ length: count }, () => `
        <article class="card">
          <div class="thumb skeleton"></div>
          <div class="body">
            <div class="skeleton" style="height:18px;border-radius:.4rem;margin-bottom:.5rem"></div>
            <div class="skeleton" style="height:14px;border-radius:.4rem;width:60%"></div>
          </div>
        </article>`).join('');
    }

    const PLAY_SVG = '<svg viewBox="0 0 68 48" width="56" height="40" aria-hidden="true"><path d="M66.5 7.7a8.5 8.5 0 0 0-6-6C55.2.3 34 .3 34 .3s-21.2 0-26.5 1.4a8.5 8.5 0 0 0-6 6C.1 13 .1 24 .1 24s0 11 1.4 16.3a8.5 8.5 0 0 0 6 6C12.8 47.7 34 47.7 34 47.7s21.2 0 26.5-1.4a8.5 8.5 0 0 0 6-6C67.9 35 67.9 24 67.9 24s0-11-1.4-16.3z" fill="#8f0000" fill-opacity=".92"/><path d="M27 34V14l18 10z" fill="#fff"/></svg>';
    const ytUrl = id => `https://www.youtube.com/watch?v=${id}`;

    function renderGrid(items){
      const pages = Math.max(1, Math.ceil(items.length / state.perPage));
      if(state.page > pages) state.page = pages;
      const start = (state.page-1)*state.perPage;
      const end = start + state.perPage;
      const pageItems = items.slice(start, end);

      if(pageItems.length===0){
        elGrid.innerHTML = `<div class="empty">Nenhum resultado encontrado. Tente ajustar filtros ou termos de busca.</div>`;
        elLegend.textContent = "";
        elPrev.disabled = true; elNext.disabled = true;
        return;
      }

      elGrid.innerHTML = pageItems.map(v => {
        const t = esc(v.title);
        const play = v.embeddable
          ? `<button class="thumb__play" type="button" data-play="${v.id}" aria-label="Assistir: ${t}">${PLAY_SVG}</button>`
          : `<a class="thumb__play" href="${ytUrl(v.id)}" target="_blank" rel="noopener" aria-label="Abrir no YouTube: ${t}">${PLAY_SVG}</a>`;
        const isSaved = saved.has(v.id);
        return `
        <article class="card" data-id="${v.id}">
          <div class="thumb">
            <img src="${v.thumb}" alt="" loading="lazy" decoding="async" width="480" height="360">
            ${play}
            <div class="badge-row">
              <span class="badge">${esc(TYPE_LABEL[v.type])}</span>
              <span class="badge">${fmtDur(v.durationSec)}</span>
            </div>
          </div>
          <div class="body">
            <h3 class="title" title="${t}">${t}</h3>
            <div class="meta meta--stack">
              <span class="meta__game">${esc(v.game)}</span>
              <span class="meta__stats">${[
                v.views != null ? `${fmtViews(v.views)} ${v.views === 1 ? 'visualização' : 'visualizações'}` : '',
                v.dateISO ? `<time datetime="${v.dateISO}">${fmtDateShort(v.dateISO)}</time>` : ''
              ].filter(Boolean).join(' <span aria-hidden="true">·</span> ')}</span>
            </div>
            <div class="actions">
              ${v.embeddable
                ? `<button class="btn btn--play" data-play="${v.id}" aria-label="Assistir ${t}">Assistir</button>`
                : `<a class="btn btn--play" href="${ytUrl(v.id)}" target="_blank" rel="noopener">Abrir no YouTube</a>`}
              <button class="btn btn--save btn--small${isSaved ? ' is-saved' : ''}" data-save="${v.id}" aria-pressed="${isSaved}">${isSaved ? 'Salvo' : 'Salvar'}</button>
            </div>
          </div>
        </article>`;
      }).join('');

      const total = items.length;
      elLegend.textContent = `Exibindo ${start+1} a ${Math.min(end,total)} de ${total} ${total === 1 ? 'vídeo' : 'vídeos'}`;
      elPrev.disabled = state.page===1;
      elNext.disabled = end >= total;
    }

    // um único listener para a grade (assistir / salvar)
    elGrid.addEventListener('click', e => {
      const play = e.target.closest('button[data-play]');
      if(play){ const v = VIDEOS.find(x => x.id === play.dataset.play); if(v) openModal(v); return; }
      const save = e.target.closest('[data-save]');
      if(save){
        const id = save.dataset.save;
        saved.has(id) ? saved.delete(id) : saved.add(id);
        persistSaved();
        const on = saved.has(id);
        save.textContent = on ? 'Salvo' : 'Salvar';
        save.classList.toggle('is-saved', on);
        save.setAttribute('aria-pressed', String(on));
      }
    });

    // ===== Modal Player (iframe só é criado aqui, no clique) =====
    const modal = document.getElementById('modal');
    const mbody = document.getElementById('mbody');
    const mtitle = document.getElementById('mtitle');
    const mclose = document.getElementById('mclose');
    let lastFocus = null;

    function openModal(v){
      lastFocus = document.activeElement;
      mtitle.textContent = v.title;
      const iframe = document.createElement('iframe');
      iframe.src = `https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0`;
      iframe.title = v.title;
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      iframe.allowFullscreen = true;
      iframe.setAttribute('frameborder', '0');
      mbody.replaceChildren(iframe);
      modal.classList.add('open');
      modal.setAttribute('aria-hidden','false');
      mclose.focus();
    }
    function closeModal(){
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden','true');
      mbody.replaceChildren();
      if(lastFocus) lastFocus.focus();
    }
    mclose.addEventListener('click', closeModal);
    modal.addEventListener('click', e=>{ if(e.target===modal) closeModal(); });
    window.addEventListener('keydown', e=>{ if(e.key==='Escape' && modal.classList.contains('open')) closeModal(); });

    // ===== Bind Controles =====
    elQ.addEventListener('input', debounce(()=>{ state.q = elQ.value; state.page = 1; update(); }, 200));
    elClear.addEventListener('click', ()=>{ elQ.value = ""; state.q = ""; state.page = 1; update(); elQ.focus(); });
    elSort.addEventListener('change', ()=>{ state.sort = elSort.value; state.page = 1; update(); });
    elDuration.addEventListener('change', ()=>{ state.duration = elDuration.value; state.page = 1; update(); });
    elType.addEventListener('change', ()=>{ state.type = elType.value; state.page = 1; update(); });
    elPrev.addEventListener('click', ()=>{ if(state.page>1){ state.page--; update(); } });
    elNext.addEventListener('click', ()=>{ state.page++; update(); });

    function debounce(fn, wait){ let t; return (...args)=>{ clearTimeout(t); t = setTimeout(()=>fn(...args), wait); }; }

    // ===== URL Sync =====
    function syncFromURL(){
      const p = new URLSearchParams(location.search);
      state.q = p.get('q') || state.q;
      state.type = p.get('type') || state.type;
      state.duration = p.get('dur') || state.duration;
      state.sort = p.get('sort') || state.sort;
      state.category = p.get('cat') || state.category;
      state.page = Math.max(1, parseInt(p.get('page') || state.page, 10) || 1);
      elQ.value = state.q;
      elDuration.value = state.duration;
    }
    function pushURL(){
      const p = new URLSearchParams();
      if(state.q) p.set('q',state.q);
      if(state.type!=='all') p.set('type',state.type);
      if(state.duration!=='all') p.set('dur',state.duration);
      if(state.sort!=='recent') p.set('sort',state.sort);
      if(state.category!=='todas') p.set('cat',state.category);
      if(state.page!==1) p.set('page',String(state.page));
      const query = p.toString();
      history.replaceState(null,'', query ? `?${query}` : location.pathname);
    }

    // ===== Update =====
    function update(){
      renderChips();
      renderSkeletons(6);
      requestAnimationFrame(()=>{ renderGrid(applyFilters()); pushURL(); });
    }

    // ===== Dados estruturados (JSON-LD) dos vídeos exibidos =====
    const isoDur = s => { s = Math.max(1, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return 'PT' + (h ? h + 'H' : '') + (m ? m + 'M' : '') + (x || (!h && !m) ? x + 'S' : ''); };
    function setLD(id, data){ let el = document.getElementById(id); if(!data){ if(el) el.remove(); return; } if(!el){ el = document.createElement('script'); el.type = 'application/ld+json'; el.id = id; document.head.appendChild(el); } el.textContent = JSON.stringify(data).replace(/</g, '\\u003c'); }
    function setVideosLD(list){
      const items = list.filter(v => v.dateISO).slice(0, 50).map((v, i) => ({
        "@type": "ListItem", "position": i + 1,
        "item": {
          "@type": "VideoObject", "@id": `https://www.youtube.com/watch?v=${v.id}`,
          "name": v.title, "description": v.description || v.title,
          "thumbnailUrl": [v.thumb], "uploadDate": v.dateISO, "duration": isoDur(v.durationSec),
          "embedUrl": `https://www.youtube.com/embed/${v.id}`, "url": `https://www.youtube.com/watch?v=${v.id}`,
          "inLanguage": "pt-BR",
          ...(v.views != null ? { "interactionStatistic": { "@type": "InteractionCounter", "interactionType": { "@type": "WatchAction" }, "userInteractionCount": v.views } } : {}),
        }
      }));
      setLD('ld-videos', items.length ? { "@context": "https://schema.org", "@type": "ItemList", "name": "Vídeos do canal Flloydinn Gameplay",
        "url": "https://flloydinn.netlify.app/videos.html", "numberOfItems": items.length, "itemListElement": items } : null);
    }

    // ===== Inicialização =====
    (async function init(){
      syncFromURL();
      renderSkeletons(8);
      const { list, src } = await loadCatalog();
      VIDEOS = list;
      setVideosLD(list);
      if(src !== 'catalogo'){
        elNotice.textContent = src === 'tv'
          ? 'Mostrando os vídeos da programação da TV: o catálogo completo não carregou agora.'
          : 'Mostrando uma seleção de vídeos: a lista do canal não carregou agora. Tente recarregar a página.';
        elNotice.hidden = false;
      }
      setupFilters();
      update();
    })();
  </script>
</body>
</html>
