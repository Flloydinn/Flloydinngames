  <style>

    /* Utilitários desta página */
    .tag{font-size:.75rem;background:rgba(0,0,0,.5);border:1px solid var(--border);padding:.15rem .45rem;border-radius:.4rem;font-weight:700}

    /* Hero / Próximo evento */
    .hero{border-bottom:1px solid var(--border);background:radial-gradient(900px 260px at 15% 5%, rgba(233,33,33,.22),transparent 60%)}
    .hero__grid{display:grid;grid-template-columns:1.1fr .9fr;gap:1rem;padding:1.2rem 0}
    .feature{background:var(--card);border:1px solid var(--border);border-radius:1rem;padding:1rem}
    .feature h1{margin:.2rem 0 .4rem;font-size:1.8rem}
    .next{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
    .pill{border:1px solid var(--border);padding:.25rem .5rem;border-radius:.5rem;background:#0f1116;font-weight:700}
    .count{display:flex;gap:.6rem;flex-wrap:wrap}
    .boxnum{background:#0f1116;border:1px solid var(--border);border-radius:.6rem;padding:.35rem .55rem;font-weight:800}

    /* Toolbar */
    .toolbar{position:sticky;top:64px;z-index:50;background:rgba(16,16,18,.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--border)}
    .toolbar__inner{display:grid;grid-template-columns:1fr auto auto auto;gap:.6rem;align-items:center;padding:1rem 0}
    .searchbox{display:flex;gap:.6rem;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:.8rem;padding:.5rem .7rem}
    .searchbox input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font-size:1rem;padding:.35rem}
    .select{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:.6rem;padding:.55rem .9rem;font-weight:600;cursor:pointer}

    /* Calendário + lista */
    .layout{display:grid;grid-template-columns:1.3fr .7fr;gap:1rem;padding:1.2rem 0}
    .calendar{background:var(--card);border:1px solid var(--border);border-radius:1rem;overflow:hidden}
    .cal-head{display:flex;align-items:center;justify-content:space-between;padding:.7rem .9rem;border-bottom:1px solid var(--border)}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border)}
    .cal-grid>div{background:#0f1116;min-height:96px;padding:.4rem;position:relative}
    .dow{background:#101218;font-weight:800;text-align:center;padding:.5rem 0;border-bottom:1px solid var(--border)}
    .daynum{position:absolute;top:.35rem;right:.4rem;color:var(--muted);font-size:.9rem}
    .cell .evt{display:block;margin:.2rem 0 0;padding:.2rem .35rem;border-radius:.4rem;font-size:.8rem;border:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .evt.live{background:rgba(143,0,0,.2)}
    .evt.launch{background:rgba(255,184,77,.15)}
    .evt.tour{background:rgba(87,217,150,.12)}
    .evt.rec{background:rgba(166,166,173,.15)}
    .muted{opacity:.45}
    .list{background:var(--card);border:1px solid var(--border);border-radius:1rem;overflow:hidden}
    .list h3{margin:.7rem .9rem}
    .items{display:grid;gap:.6rem;padding:0 .9rem .9rem}
    .item{display:grid;grid-template-columns:1fr auto;gap:.6rem;align-items:center;background:#0f1116;border:1px solid var(--border);border-radius:.6rem;padding:.6rem}
    .item .meta{color:var(--muted);font-size:.9rem}
    .empty{padding:1rem;color:var(--muted);text-align:center}

    /* Modal */
    .modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.7);z-index:100;padding:1rem}
    .modal.open{display:grid}
    .dialog{width:min(840px,100%);background:var(--bg-soft);border:1px solid var(--border);border-radius:1rem;overflow:hidden;box-shadow:var(--shadow)}
    .dialog__head{display:flex;align-items:center;justify-content:space-between;padding:.8rem .9rem;border-bottom:1px solid var(--border)}
    .dialog__body{padding:.9rem;display:grid;gap:.6rem}
    .actions{display:flex;gap:.5rem;flex-wrap:wrap}

    @media (max-width:1000px){.hero__grid{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.toolbar__inner{grid-template-columns:1fr 1fr 1fr;row-gap:.6rem}}
    /* Celular: barra de filtros em 2 colunas, busca na largura toda e selects que encolhem (sem rolagem lateral) */
    .toolbar__inner > *{min-width:0}
    .select{max-width:100%;min-width:0}
    @media (max-width:640px){
      .toolbar__inner{grid-template-columns:1fr 1fr}
      .toolbar__inner .searchbox{grid-column:1/-1}
      .toolbar__inner .select, .toolbar__inner .btn{width:100%}
    }
  </style>

  <script>
    // ====== Base / Fuso ======
    const TZN = 'America/Sao_Paulo'; // BRT
    const $ = s => document.querySelector(s);
    const pad = n => String(n).padStart(2,'0');
    const toLocal = iso => new Date(iso);
    const fmtDateTime = (iso) => {
      const d = toLocal(iso);
      return d.toLocaleString('pt-BR', { timeZone: TZN, weekday:'short', day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
    };
    const fmtDate = (iso) => {
      const d = toLocal(iso);
      return d.toLocaleDateString('pt-BR', { timeZone: TZN, day:'2-digit', month:'short', year:'numeric' });
    };

    // ====== Dataset de eventos (edite à vontade) ======
    // status atual: 11/09/2025
    // Eventos: carregados de data/agenda.json (edite o JSON, não este arquivo)
    let EVENTS = [];

    // ====== Estado / UI ======
    const state = {
      q:'', type:'todos',
      month: new Date().getMonth(), // 0-11
      year: new Date().getFullYear()
    };

    // ====== Preenche selects mês/ano ======
    const months = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    (function fillMonthYear(){
      const mSel = $('#month'), ySel = $('#year');
      months.forEach((m,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=m; mSel.appendChild(o); });
      const yNow = new Date().getFullYear();
      for(let y=yNow-1; y<=yNow+1; y++){ const o=document.createElement('option'); o.value=y; o.textContent=y; ySel.appendChild(o); }
      mSel.value = state.month; ySel.value = state.year;
    })();

    // ====== Filtros & busca ======
    $('#q').addEventListener('input', ()=>{ state.q = $('#q').value.trim().toLowerCase(); renderAll(); });
    $('#clearQ').addEventListener('click', ()=>{ $('#q').value=''; state.q=''; renderAll(); });
    $('#type').addEventListener('change', ()=>{ state.type = $('#type').value; renderAll(); });
    $('#month').addEventListener('change', ()=>{ state.month = +$('#month').value; renderCalendar(); });
    $('#year').addEventListener('change', ()=>{ state.year = +$('#year').value; renderCalendar(); });
    $('#prev').addEventListener('click', ()=>{ changeMonth(-1); });
    $('#next').addEventListener('click', ()=>{ changeMonth(1); });
    $('#todayBtn').addEventListener('click', ()=>{ const d=new Date(); state.month=d.getMonth(); state.year=d.getFullYear(); $('#month').value=state.month; $('#year').value=state.year; renderCalendar(); });

    function changeMonth(delta){
      let m = state.month + delta, y = state.year;
      if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
      state.month=m; state.year=y; $('#month').value=m; $('#year').value=y;
      renderCalendar();
    }

    // ====== Helpers: ICS / Google Calendar ======
    function toICSDate(iso){
      const d = new Date(iso);
      const yyyy = d.getUTCFullYear();
      const mm = pad(d.getUTCMonth()+1);
      const dd = pad(d.getUTCDate());
      const hh = pad(d.getUTCHours());
      const mi = pad(d.getUTCMinutes());
      const ss = pad(d.getUTCSeconds());
      return `${yyyy}${mm}${dd}T${hh}${mi}${ss}Z`;
    }
    function makeICSSingle(ev){
      const uid = ev.id+'@flloydinn';
      const vevent = [
        'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Flloydinn//Agenda//PT-BR',
        'CALSCALE:GREGORIAN','METHOD:PUBLISH',
        'BEGIN:VEVENT',
        `UID:${uid}`,
        `DTSTAMP:${toICSDate(new Date().toISOString())}`,
        `DTSTART:${toICSDate(ev.start)}`,
        `DTEND:${toICSDate(ev.end)}`,
        `SUMMARY:${ev.title}`,
        `DESCRIPTION:${(ev.desc||'')}`.replace(/\n/g,'\\n'),
        `LOCATION:${(ev.where||'Online')}`,
        'END:VEVENT','END:VCALENDAR'
      ].join('\r\n');
      return new Blob([vevent], {type:'text/calendar'});
    }
    function downloadBlob(blob, name){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = name; a.click();
      URL.revokeObjectURL(url);
    }
    // .ics com todos eventos futuros
    $('#dlAll').addEventListener('click', ()=>{
      const now = new Date();
      const future = EVENTS.filter(e=> new Date(e.end) >= now);
      if(future.length===0) return alert('Sem eventos futuros.');
      const parts = [
        'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Flloydinn//Agenda//PT-BR','CALSCALE:GREGORIAN','METHOD:PUBLISH'
      ];
      future.forEach(ev=>{
        parts.push('BEGIN:VEVENT');
        parts.push(`UID:${ev.id}@flloydinn`);
        parts.push(`DTSTAMP:${toICSDate(new Date().toISOString())}`);
        parts.push(`DTSTART:${toICSDate(ev.start)}`);
        parts.push(`DTEND:${toICSDate(ev.end)}`);
        parts.push(`SUMMARY:${ev.title}`);
        parts.push(`DESCRIPTION:${(ev.desc||'')}`.replace(/\n/g,'\\n'));
        parts.push(`LOCATION:${(ev.where||'Online')}`);
        parts.push('END:VEVENT');
      });
      parts.push('END:VCALENDAR');
      downloadBlob(new Blob([parts.join('\r\n')], {type:'text/calendar'}), 'agenda-flloydinn.ics');
    });

    // Google Calendar link
    function gcalLink(ev){
      const base = 'https://calendar.google.com/calendar/render?action=TEMPLATE';
      const text = encodeURIComponent(ev.title);
      const dates = `${toICSDate(ev.start)}/${toICSDate(ev.end)}`;
      const details = encodeURIComponent(ev.desc || '');
      const location = encodeURIComponent(ev.where || 'Online');
      return `${base}&text=${text}&dates=${dates}&details=${details}&location=${location}`;
    }

    // ====== Render: próximo + countdown ======
    function findNext(){
      const now = new Date();
      const list = EVENTS.filter(e => new Date(e.start) > now).sort((a,b)=> new Date(a.start)-new Date(b.start));
      return list[0] || null;
    }
    let cdTimer=null;
    function renderNext(){
      const ev = findNext();
      if(!ev){
        $('#nextTitle').textContent = 'Sem próximos eventos';
        $('#nextWhen').textContent = '';
        ['cdD','cdH','cdM','cdS'].forEach(id=>{ $('#'+id).textContent='--'; });
        return;
      }
      $('#nextTitle').textContent = `${ev.title} (${ev.game||ev.type})`;
      const d = new Date(ev.start);
      $('#nextWhen').textContent = fmtDateTime(ev.start);
      // countdown
      if(cdTimer) clearInterval(cdTimer);
      function tick(){
        const now = new Date();
        let sec = Math.floor((d - now)/1000);
        if(sec < 0){ renderNext(); return; }
        const days = Math.floor(sec/86400); sec%=86400;
        const hrs  = Math.floor(sec/3600); sec%=3600;
        const mins = Math.floor(sec/60); const secs = sec%60;
        $('#cdD').textContent = days+'d'; $('#cdH').textContent = pad(hrs)+'h';
        $('#cdM').textContent = pad(mins)+'m'; $('#cdS').textContent = pad(secs)+'s';
      }
      tick(); cdTimer = setInterval(tick, 1000);
    }

    // ====== Render: calendário ======
    function eventsForDay(y,m,d){
      const start = new Date(y, m, d, 0,0,0);
      const end   = new Date(y, m, d, 23,59,59);
      return EVENTS.filter(e => {
        const s = new Date(e.start), ee = new Date(e.end);
        return (s <= end && ee >= start); // toca o dia
      });
    }
    function renderCalendar(){
      $('#calTitle').textContent = `${months[state.month]} ${state.year}`;
      const cal = $('#cal'); cal.innerHTML='';
      const first = new Date(state.year, state.month, 1);
      const firstDow = first.getDay(); // 0=dom
      const daysInMonth = new Date(state.year, state.month+1, 0).getDate();
      const prevDays = new Date(state.year, state.month, 0).getDate();
      // cabeçalho de dias já está acima; agora células
      const totalCells = 42; // 6 semanas
      for(let i=0;i<totalCells;i++){
        const cell = document.createElement('div');
        cell.className = 'cell';
        let dayNum, realMonth = state.month, realYear = state.year, muted=false;
        if(i < firstDow){ // dias do mês anterior
          dayNum = prevDays - firstDow + i + 1; muted=true;
          realMonth = (state.month + 11)%12; realYear = state.month===0 ? state.year-1 : state.year;
        }else if(i >= firstDow + daysInMonth){
          dayNum = i - (firstDow + daysInMonth) + 1; muted=true;
          realMonth = (state.month + 1)%12; realYear = state.month===11 ? state.year+1 : state.year;
        }else{
          dayNum = i - firstDow + 1;
        }
        const y = realYear, m = realMonth, d = dayNum;
        const label = document.createElement('div'); label.className='daynum'+(muted?' muted':''); label.textContent=String(d);
        cell.appendChild(label);

        const dayEvents = eventsForDay(y,m,d)
          .filter(filterByUI)
          .filter(searchByUI)
          .sort((a,b)=> new Date(a.start) - new Date(b.start));

        dayEvents.slice(0,3).forEach(ev=>{
          const a = document.createElement('a');
          a.href='#'; a.className='evt '+ev.type; a.textContent = ev.title;
          a.title = `${fmtDateTime(ev.start)} — ${ev.title}`;
          a.addEventListener('click', (e)=>{ e.preventDefault(); openModal(ev); });
          cell.appendChild(a);
        });
        if(dayEvents.length>3){
          const more = document.createElement('div');
          more.className='evt'; more.textContent = `+${dayEvents.length-3} eventos`;
          more.addEventListener('click', ()=> openDayModal(y,m,d,dayEvents));
          cell.appendChild(more);
        }
        cal.appendChild(cell);
      }
      renderUpcoming();
    }

    function filterByUI(ev){
      return state.type==='todos' ? true : ev.type===state.type;
    }
    function searchByUI(ev){
      if(!state.q) return true;
      const hay = [ev.title, ev.game, ev.desc, ev.where].join(' ').toLowerCase();
      return hay.includes(state.q);
    }

    // ====== Render: lista próximos ======
    function renderUpcoming(){
      const now = new Date();
      const list = EVENTS
        .filter(e=> new Date(e.end) >= now)
        .filter(filterByUI)
        .filter(searchByUI)
        .sort((a,b)=> new Date(a.start)-new Date(b.start))
        .slice(0,10);

      const box = $('#upcoming');
      if(list.length===0){ box.innerHTML = `<div class="empty">Nada por aqui com esses filtros.</div>`; return; }
      box.innerHTML = list.map(ev=>`
        <article class="item">
          <div>
            <strong>${esc(ev.title)}</strong>
            <div class="meta">${fmtDateTime(ev.start)} • ${esc(ev.where || 'Online')}</div>
          </div>
          <div style="display:flex;gap:.4rem">
            <button class="btn btn--ghost btn--small" data-view="${ev.id}">Ver</button>
            <button class="btn btn--small" data-ics="${ev.id}">.ics</button>
          </div>
        </article>
      `).join('');
      box.querySelectorAll('[data-view]').forEach(b=> b.onclick = ()=> openModalById(b.dataset.view));
      box.querySelectorAll('[data-ics]').forEach(b=> b.onclick = ()=> downloadBlob(makeICSSingle(EVENTS.find(e=>e.id===b.dataset.ics)), `${b.dataset.ics}.ics`));
    }

    // ====== Modal de evento ======
    const modal = $('#modal'); const mClose = $('#mClose');
    mClose.addEventListener('click', ()=> closeModal());
    modal.addEventListener('click', (e)=>{ if(e.target===modal) closeModal(); });

    function openModalById(id){ const ev = EVENTS.find(e=>e.id===id); if(ev) openModal(ev); }
    function openModal(ev){
      $('#mTitle').textContent = ev.title;
      $('#mInfo').textContent = `${fmtDateTime(ev.start)} — ${fmtDateTime(ev.end)} • ${ev.where || 'Online'} • ${ev.game || ''}`;
      $('#mDesc').textContent = ev.desc || '';
      $('#mIcs').onclick = ()=> downloadBlob(makeICSSingle(ev), `${ev.id}.ics`);
      $('#mGcal').href = gcalLink(ev);
      $('#mCopy').onclick = async ()=>{
        try { await navigator.clipboard.writeText(`${ev.title} — ${fmtDateTime(ev.start)} (${ev.where||'Online'})`); alert('Copiado!'); }
        catch { alert('Não foi possível copiar.'); }
      };
      modal.classList.add('open'); modal.setAttribute('aria-hidden','false');
    }
    function closeModal(){ modal.classList.remove('open'); modal.setAttribute('aria-hidden','true'); }

    // Dia com vários eventos (atalho simples)
    function openDayModal(y,m,d,events){
      const t = `${pad(d)}/${pad(m+1)}/${y}`;
      $('#mTitle').textContent = `Eventos em ${t}`;
      $('#mInfo').innerHTML = events.map(ev=>`• ${fmtDateTime(ev.start)} — ${esc(ev.title)}`).join(' | ');
      $('#mDesc').textContent = 'Selecione um evento na grade para baixar .ics individual.';
      $('#mIcs').onclick = ()=> {
        const parts = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Flloydinn//Agenda//PT-BR','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
        events.forEach(ev=>{
          parts.push('BEGIN:VEVENT');
          parts.push(`UID:${ev.id}@flloydinn`);
          parts.push(`DTSTAMP:${toICSDate(new Date().toISOString())}`);
          parts.push(`DTSTART:${toICSDate(ev.start)}`);
          parts.push(`DTEND:${toICSDate(ev.end)}`);
          parts.push(`SUMMARY:${ev.title}`);
          parts.push(`DESCRIPTION:${(ev.desc||'')}`.replace(/\n/g,'\\n'));
          parts.push(`LOCATION:${(ev.where||'Online')}`);
          parts.push('END:VEVENT');
        });
        parts.push('END:VCALENDAR');
        downloadBlob(new Blob([parts.join('\r\n')], {type:'text/calendar'}), `eventos-${y}-${pad(m+1)}-${pad(d)}.ics`);
      };
      $('#mGcal').href = '#';
      $('#mCopy').onclick = async ()=>{};
      modal.classList.add('open'); modal.setAttribute('aria-hidden','false');
    }

    // ====== Render geral ======
    function renderAll(){
      renderCalendar();
      renderNext();
    }

    // ====== Dados: data/agenda.json ======
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const EV_TYPES = ['live', 'launch', 'tour', 'rec'];
    const validEvent = e => e && /^[\w-]{1,60}$/.test(String(e.id)) && typeof e.title === 'string' && e.title.trim() &&
      !isNaN(Date.parse(e.start)) && !isNaN(Date.parse(e.end));
    async function loadEvents(){
      const r = await fetch('data/agenda.json', { cache: 'no-cache' });
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      return (Array.isArray(d) ? d : (d.events || [])).filter(validEvent).map(e => {
        const type = EV_TYPES.includes(e.type) ? e.type : 'live';
        return { ...e, id: String(e.id), type, color: EV_TYPES.includes(e.color) ? e.color : type };
      });
    }
    function showAgendaError(){
      $('#nextTitle').textContent = 'Agenda indisponível no momento';
      $('#upcoming').innerHTML = `<div class="empty">Não foi possível carregar a agenda agora.
        <div style="display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:.6rem">
          <button class="btn btn--small" id="retryAgenda" type="button">Tentar de novo</button>
          <a class="btn btn--ghost btn--small" href="https://www.youtube.com/@flloydinn" target="_blank" rel="noopener">Avisos no YouTube</a>
        </div></div>`;
      $('#retryAgenda').onclick = init;
    }

    // ====== Dados estruturados (JSON-LD): só eventos futuros e públicos ======
    function setLD(id, data){ let el = document.getElementById(id); if(!data){ if(el) el.remove(); return; } if(!el){ el = document.createElement('script'); el.type = 'application/ld+json'; el.id = id; document.head.appendChild(el); } el.textContent = JSON.stringify(data).replace(/</g, '\\u003c'); }
    function setEventsLD(list){
      const now = Date.now();
      const evs = list.filter(e => e.type !== 'rec' && Date.parse(e.end) > now).slice(0, 20).map(e => {
        const online = /youtube|discord|live|online|steam|pc/i.test(e.where || '') || e.type === 'live';
        return {
          "@type": "Event", "name": e.title, "description": e.desc || e.title,
          "startDate": e.start, "endDate": e.end,
          "eventStatus": "https://schema.org/EventScheduled",
          "eventAttendanceMode": online ? "https://schema.org/OnlineEventAttendanceMode" : "https://schema.org/OfflineEventAttendanceMode",
          "location": online ? { "@type": "VirtualLocation", "url": "https://www.youtube.com/@flloydinn" } : { "@type": "Place", "name": e.where || "A definir" },
          "organizer": { "@type": "Organization", "@id": "https://flloydinn.netlify.app/#org", "name": "Flloydinn", "url": "https://flloydinn.netlify.app/" },
          "image": ["https://flloydinn.netlify.app/assets/og-flloydinn.jpg"],
          "isAccessibleForFree": true,
          "url": "https://flloydinn.netlify.app/agenda.html#" + encodeURIComponent(e.id),
        };
      });
      setLD('ld-events', evs.length ? { "@context": "https://schema.org", "@graph": evs } : null);
    }

    // Init
    async function init(){
      $('#upcoming').innerHTML = '<div class="empty">Carregando agenda…</div>';
      try{ EVENTS = await loadEvents(); renderAll(); setEventsLD(EVENTS); }
      catch(err){ console.warn('[agenda]', err); EVENTS = []; renderAll(); showAgendaError(); }
    }
    init();
  </script>
</body>
</html>
